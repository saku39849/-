<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>動画撮るよー！カメラ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #450a0a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #60a5fa, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .notice {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    video.playback {
      transform: none;
    }
    .rec-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 999px;
      display: none;
      align-items: center;
      gap: 6px;
      animation: pulse 1.2s infinite;
    }
    .rec-dot {
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      margin-bottom: 10px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-start {
      background: linear-gradient(90deg, #2563eb, #dc2626);
      color: #fff;
      display: none;
    }
    .btn-stop {
      background: #dc2626;
      color: #fff;
      display: none;
    }
    .btn-save {
      background: #10b981;
      color: #fff;
      text-decoration: none;
      display: none;
    }
    .btn-retry {
      background: #334155;
      color: #fff;
      display: none;
    }
    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>動画撮るよー！</h1>
    <p class="notice" id="noticeText">
      カメラを許可するとすぐに録画が始まります！
    </p>

    <div class="video-box">
      <video id="preview" autoplay playsinline muted></video>
      <div class="rec-badge" id="recBadge">
        <span class="rec-dot"></span>
        <span id="recTimer">REC 00:00</span>
      </div>
    </div>

    <button class="btn btn-start" id="startBtn">カメラを起動する</button>
    <button class="btn btn-stop" id="stopBtn">録画ストップ</button>
    <a class="btn btn-save" id="saveBtn" download="video.webm">動画を保存する</a>
    <button class="btn btn-retry" id="retryBtn">もう一回撮る</button>

    <p class="status-text" id="statusText">自動起動中...</p>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const saveBtn = document.getElementById('saveBtn');
    const retryBtn = document.getElementById('retryBtn');
    const preview = document.getElementById('preview');
    const recBadge = document.getElementById('recBadge');
    const recTimer = document.getElementById('recTimer');
    const noticeText = document.getElementById('noticeText');
    const statusText = document.getElementById('statusText');

    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let timerInterval = null;
    let seconds = 0;

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    async function initCameraAndRecord() {
      try {
        startBtn.style.display = 'none';
        statusText.textContent = 'カメラの許可を確認中...';
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true
        });

        preview.srcObject = stream;
        preview.classList.remove('playback');
        preview.muted = true;
        await preview.play();

        startRecording();
      } catch (err) {
        statusText.textContent = '下のボタンを押してカメラを許可してください';
        startBtn.style.display = 'block';
      }
    }

    function startRecording() {
      recordedChunks = [];
      const mimeTypes = [
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm'
      ];
      let selectedMime = '';
      for (const type of mimeTypes) {
        if (MediaRecorder.isTypeSupported(type)) {
          selectedMime = type;
          break;
        }
      }

      mediaRecorder = selectedMime
        ? new MediaRecorder(stream, { mimeType: selectedMime })
        : new MediaRecorder(stream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, {
          type: mediaRecorder.mimeType || 'video/mp4'
        });
        const url = URL.createObjectURL(blob);

        stream.getTracks().forEach(track => track.stop());
        preview.srcObject = null;
        preview.src = url;
        preview.classList.add('playback');
        preview.muted = false;
        preview.controls = true;
        preview.play();

        const ext = (mediaRecorder.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
        saveBtn.href = url;
        saveBtn.download = `movie_${Date.now()}.${ext}`;
        saveBtn.style.display = 'block';
        retryBtn.style.display = 'block';
        noticeText.textContent = '録画完了！下のボタンから保存できます。';
        statusText.textContent = 'プレビュー再生中';
      };

      mediaRecorder.start();
      seconds = 0;
      recTimer.textContent = 'REC 00:00';
      recBadge.style.display = 'flex';
      stopBtn.style.display = 'block';
      noticeText.textContent = '動画撮るよー！録画中です！';
      statusText.textContent = '録画中...';

      timerInterval = setInterval(() => {
        seconds++;
        recTimer.textContent = `REC ${formatTime(seconds)}`;
      }, 1000);
    }

    startBtn.addEventListener('click', initCameraAndRecord);

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      clearInterval(timerInterval);
      recBadge.style.display = 'none';
      stopBtn.style.display = 'none';
    });

    retryBtn.addEventListener('click', () => {
      location.reload();
    });

    window.addEventListener('DOMContentLoaded', initCameraAndRecord);
  </script>
</body>
</html>
